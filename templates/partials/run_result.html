{% if success %}
  {% if has_text %}
    <p id="output-{{ mode }}" class="result-text">{{ text }}</p>
    {% if has_request_id %}
      <p id="request-{{ mode }}" class="request-id result-request-id" hx-swap-oob="true">{{ request_id }}</p>
    {% else %}
      <p id="request-{{ mode }}" class="request-id result-request-id" hx-swap-oob="true"></p>
    {% endif %}
  {% else %}
    <p id="output-{{ mode }}" class="muted">{{ placeholder }}</p>
    <p id="request-{{ mode }}" class="request-id result-request-id" hx-swap-oob="true"></p>
  {% endif %}
{% else %}
  <div class="alert alert-error">
    <strong>处理失败</strong>
    <p>{{ error }}</p>
  </div>
  <p id="request-{{ mode }}" class="request-id result-request-id" hx-swap-oob="true"></p>
{% endif %}
