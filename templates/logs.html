<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>调用日志 - Prompt Pocket</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/htmx.min.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <div class="shell shell-logs">
        <header class="card border-0 shadow-sm">
          <div class="card-body d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center justify-content-between gap-3">
            <a class="brand brand-link" href="/" aria-label="返回首页">
              <div class="brand-mark">P</div>
              <div class="brand-copy">
                <h1>Prompt Pocket</h1>
                <p>翻译、润色和语法修正，一屏完成。</p>
              </div>
            </a>

            <div class="toolbar d-flex flex-column flex-sm-row flex-wrap align-items-stretch align-items-sm-center justify-content-lg-end gap-2">
              <a class="btn btn-outline-secondary" href="/">返回工具</a>
              <button
                class="btn btn-primary"
                type="button"
                hx-get="/ui/logs"
                hx-target="#logs-list"
                hx-swap="innerHTML"
                hx-indicator="#logs-refresh-indicator"
              >
                <span id="logs-refresh-indicator" class="spinner-border spinner-border-sm button-spinner htmx-indicator" aria-hidden="true"></span>
                <span class="button-label-idle">刷新</span>
                <span class="button-label-loading">刷新中</span>
              </button>
            </div>
          </div>
        </header>

        <section id="logs-list" class="card border-0 shadow-sm overflow-hidden">
          {{ logs_list_html|safe }}
        </section>
      </div>
    </main>
  </body>
</html>
